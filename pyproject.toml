[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dazel"
version = "1.0.0"
description = "Run bazel in Docker, in a reproducible and portable container."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "nadir.izr", email = "nadir@armis.com" }]
keywords = ["bazel", "docker"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ArmisSecurity/dazel"
Upstream = "https://github.com/nadirizr/dazel"

[project.scripts]
dazel = "dazel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyrefly>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dazel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers --cov=dazel --cov-report=term-missing"
markers = ["integration: needs a running docker daemon"]

[tool.coverage.run]
branch = true
source = ["dazel"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211 (blank line before class docstring)
  "D213",   # conflicts with D212 (summary on the first docstring line)
  "D107",   # the class docstring documents construction; __init__ needs none
  "CPY001", # licensing lives in the LICENSE file, not per-file headers
  "COM812", # conflicts with the ruff formatter
  "ISC001", # conflicts with the ruff formatter
  "S603",   # subprocess is this tool's purpose; argv lists are built from the user's own .dazelrc
  "S607",   # docker/docker-compose are resolved through PATH by design, as the user configures them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # pytest uses bare asserts
  "D",       # docstrings are required for public API only, not for tests
  "PLR2004", # expected values in assertions are literals by nature
  "FBT001",  # pytest passes parametrized booleans positionally
  "S108",    # fixed fake paths in argv expectations are never touched on disk
]

[tool.ruff.lint.isort]
known-first-party = ["dazel"]
known-local-folder = ["fakes", "conftest"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "tests"]
python-version = "3.11"
