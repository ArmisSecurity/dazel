name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      # Runs the pre-commit stage only; commit messages are checked by the pr-title job.
      - uses: j178/prek-action@v3

  pr-title:
    # Pull requests are squash merged, so the title becomes the commit subject on master.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uvx gitfluff==0.9.1 lint --message "$TITLE"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping when the docker daemon is unavailable.
      DAZEL_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest -m integration --no-cov

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: dazel:ci
      - name: bazel runs in the image
        run: |
          docker buildx build --load -t dazel:ci .
          docker run --rm -e USE_BAZEL_VERSION=8.4.2 dazel:ci bazel --version
